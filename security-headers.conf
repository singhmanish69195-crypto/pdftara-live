add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Same-origin aur require-corp headers yahan se hata diye hain 
# taaki Google Ads bina kisi rukawat ke load ho sakein.
# WASM ka kaam ab 'coi-serviceworker.js' sambhaal lega.
